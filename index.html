<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タグレシピ — Danbooruタグからプロンプトを組み立てる</title>
<meta name="description" content="Danbooruのタグ一覧（日本語つき）から、NovelAI / Stable Diffusion 用のプロンプトを予測変換で組み立てるツール。">
<style>
  :root{
    --ink:#14161c; --ink-2:#1b1e26; --ink-3:#232733; --line:#333949;
    --paper:#f4efe3; --sub:#9aa3b8; --shu:#bc4b3c; --shu-lt:#e7a79b;
    --ai:#5b7fa6; --midori:#6b8f6b; --yama:#b08d57; --murasaki:#8a6f9e;
    --radius:10px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--ink); color:var(--paper); display:flex; flex-direction:column;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    font-size:14px; line-height:1.6;
  }
  header{
    display:flex; align-items:center; gap:12px; padding:10px 16px;
    border-bottom:1px solid var(--line); background:var(--ink-2); flex-wrap:wrap;
  }
  h1{ font-size:15px; margin:0; letter-spacing:.04em; }
  h1 small{ color:var(--sub); font-weight:400; font-size:11.5px; margin-left:8px; }
  .grow{ flex:1; }
  .btn{
    background:transparent; color:var(--paper); border:1px solid var(--line);
    border-radius:7px; padding:5px 11px; font:inherit; font-size:12.5px; cursor:pointer;
  }
  .btn:hover{ background:rgba(244,239,227,.08); }
  .btn.primary{ background:var(--shu); border-color:var(--shu); }
  .btn.primary:hover{ background:#a8header; filter:brightness(1.1); }
  .btn.sm{ padding:2px 7px; font-size:11.5px; }
  main{ flex:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0; overflow:hidden; }
  .pane{ overflow-y:auto; padding:16px; }
  .pane + .pane{ border-left:1px solid var(--line); }
  @media (max-width:900px){
    main{ grid-template-columns:1fr; grid-template-rows:auto auto; overflow:auto; }
    .pane{ overflow:visible; }
    .pane + .pane{ border-left:none; border-top:1px solid var(--line); }
  }
  h2{ font-size:12px; color:var(--sub); margin:0 0 10px; letter-spacing:.1em; font-weight:600; }
  h2::before{ content:""; display:inline-block; width:3px; height:11px; background:var(--shu); margin-right:7px; vertical-align:-1px; }
  .search-wrap{ position:relative; margin-bottom:10px; }
  input[type=text], input[type=search], textarea, select{
    width:100%; background:var(--ink-3); color:var(--paper); border:1px solid var(--line);
    border-radius:8px; padding:9px 11px; font:inherit;
  }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--shu); }
  .hint{ color:var(--sub); font-size:11.5px; margin:6px 0; }
  .results{ display:flex; flex-direction:column; gap:2px; }
  .row{
    display:flex; align-items:center; gap:9px; padding:6px 9px; border-radius:7px;
    cursor:pointer; border:1px solid transparent;
  }
  .row:hover, .row.sel{ background:var(--ink-3); border-color:var(--line); }
  .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .en{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; }
  .ja{ color:var(--shu-lt); font-size:12px; }
  .cnt{ margin-left:auto; color:var(--sub); font-size:11px; font-variant-numeric:tabular-nums; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; min-height:44px; padding:8px; background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); }
  .chip{ display:flex; align-items:center; gap:5px; background:var(--ink-3); border:1px solid var(--line); border-radius:20px; padding:3px 5px 3px 10px; font-size:12.5px; }
  .chip .w{ color:var(--sub); font-size:11px; font-variant-numeric:tabular-nums; min-width:26px; text-align:center; }
  .chip.pos{ border-color:var(--shu); }
  .chip.neg{ border-color:var(--ai); }
  .chip button{ background:none; border:none; color:var(--sub); cursor:pointer; padding:0 3px; font-size:12px; line-height:1; }
  .chip button:hover{ color:var(--paper); }
  .out{ width:100%; min-height:90px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; resize:vertical; }
  .bar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0; }
  .bar label{ font-size:12px; color:var(--sub); }
  .bar select{ width:auto; padding:5px 8px; font-size:12.5px; }
  .recipe-item{ display:flex; align-items:center; gap:8px; padding:6px 9px; border:1px solid var(--line); border-radius:7px; margin-bottom:5px; background:var(--ink-2); }
  .recipe-item .nm{ flex:1; font-size:12.5px; }
  #loading{ padding:24px 16px; color:var(--sub); }
  .prog{ height:4px; background:var(--ink-3); border-radius:2px; overflow:hidden; margin-top:8px; }
  .prog i{ display:block; height:100%; background:var(--shu); width:0; transition:width .2s; }
  .err{ color:var(--shu-lt); }
  a{ color:var(--ai); }
  kbd{ background:var(--ink-3); border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>タグレシピ <small>Danbooruタグ → NovelAI / Stable Diffusion プロンプト</small></h1>
  <span class="grow"></span>
  <button class="btn" id="btn-export">レシピを書き出し</button>
  <button class="btn" id="btn-import">読み込み</button>
  <input type="file" id="file-import" accept=".json" hidden>
</header>

<div id="loading">タグ辞書を読み込んでいます…<div class="prog"><i id="prog"></i></div></div>

<main id="app" hidden>
  <section class="pane">
    <h2>タグを探す</h2>
    <div class="search-wrap">
      <input type="search" id="q" placeholder="日本語・英語どちらでも（例：ツインテール / twintails）" autocomplete="off">
    </div>
    <div class="bar">
      <label>カテゴリ</label>
      <select id="cat">
        <option value="">すべて</option>
        <option value="0">一般</option>
        <option value="4">キャラクター</option>
        <option value="3">作品</option>
        <option value="1">絵師</option>
        <option value="5">メタ</option>
      </select>
      <span class="hint" id="dictinfo"></span>
    </div>
    <div class="results" id="results"></div>
    <div id="cooc-wrap" hidden>
      <h2 style="margin-top:20px;">よく一緒に使っているタグ</h2>
      <p class="hint">保存したレシピの組み合わせから算出しています。使うほど精度が上がります。</p>
      <div class="results" id="cooc"></div>
    </div>
  </section>

  <section class="pane">
    <h2>レシピ</h2>
    <input type="text" id="recipe-name" placeholder="レシピ名（例：立ち絵・制服）">
    <div class="bar">
      <button class="btn primary sm" id="btn-save">保存</button>
      <button class="btn sm" id="btn-clear">全消去</button>
      <select id="saved"><option value="">保存済みレシピ…</option></select>
      <button class="btn sm" id="btn-del">削除</button>
    </div>
    <div class="chips" id="chips"></div>

    <div class="bar">
      <label>出力形式</label>
      <select id="fmt">
        <option value="nai-brace">NovelAI（{}／[]で強調）</option>
        <option value="nai-num">NovelAI V4（1.2::tag::）</option>
        <option value="sd">Stable Diffusion（(tag:1.2)）</option>
        <option value="plain">重みなし（カンマ区切りのみ）</option>
      </select>
      <button class="btn sm" id="btn-copy">コピー</button>
    </div>
    <textarea class="out" id="out" readonly></textarea>
    <p class="hint">タグをクリックで追加、<kbd>+</kbd><kbd>−</kbd>で強調度を調整します。同じタグは重複追加されません。</p>
  </section>
</main>

<script>
"use strict";
/* ------------------------------------------------------------------ *
 * データ読み込み
 * dist/danbooru-ja.csv（tag,category,count,"aliases",日本語）を読む。
 * 数MBあるので初回だけ取得し、IndexedDBにキャッシュする。meta.json の
 * generated_at をキーにしているので、週次更新が走れば自動で入れ替わる。
 * ------------------------------------------------------------------ */
const DATA_CSV = 'data/danbooru-ja.csv';
const META_URL = 'data/meta.json';
const CAT_COLOR = {0:'#5b7fa6', 1:'#bc4b3c', 3:'#8a6f9e', 4:'#6b8f6b', 5:'#b08d57'};
const CAT_NAME  = {0:'一般', 1:'絵師', 3:'作品', 4:'キャラ', 5:'メタ'};

let DICT = [];            // {t, c, cnt, ja, tl, jal}
let recipe = [];          // {t, ja, c, w}
const $ = id => document.getElementById(id);

function idb(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open('tagrecipe', 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('kv');
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function idbGet(k){
  const db = await idb();
  return new Promise((res, rej)=>{
    const rq = db.transaction('kv').objectStore('kv').get(k);
    rq.onsuccess = ()=> res(rq.result === undefined ? null : rq.result);
    rq.onerror = ()=> rej(rq.error);
  });
}
async function idbSet(k, v){
  const db = await idb();
  return new Promise((res, rej)=>{
    const tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').put(v, k);
    tx.oncomplete = ()=> res(true); tx.onerror = ()=> rej(tx.error);
  });
}

/* 引用符つきCSVを1行ぶん分解する。エイリアス列に , が入るため必要。 */
function parseLine(line){
  const out = []; let cur = ''; let q = false;
  for (let i=0;i<line.length;i++){
    const c = line[i];
    if (q){
      if (c === '"'){ if (line[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === ','){ out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur); return out;
}

function buildDict(text){
  const lines = text.split('\n');
  const dict = new Array(lines.length);
  let n = 0;
  for (let i=0;i<lines.length;i++){
    const line = lines[i];
    if (!line || line.charCodeAt(0) === 13) continue;
    const c = parseLine(line.charCodeAt(line.length-1) === 13 ? line.slice(0,-1) : line);
    if (c.length < 3) continue;
    const t = c[0];
    if (!t) continue;
    const ja = (c[4] || '').trim();
    /* 検索用に小文字版を1度だけ作っておく。毎キーストロークでtoLowerCaseすると
       18万件では体感できるほど遅くなる。 */
    dict[n++] = { t, c:+c[1]||0, cnt:+c[2]||0, ja, tl:t.toLowerCase(), jal:ja.toLowerCase() };
  }
  dict.length = n;
  return dict;
}

async function load(){
  const prog = $('prog');
  try{
    let stamp = 'unknown';
    try{
      const meta = await (await fetch(META_URL, {cache:'no-cache'})).json();
      stamp = meta.generated_at || 'unknown';
      $('dictinfo').textContent = `辞書 ${(meta.tag_count_total||0).toLocaleString()}件 / 日本語 ${(meta.translated_count_total||0).toLocaleString()}件（${(stamp||'').slice(0,10)}）`;
    }catch(e){ /* meta.json が無くても致命的ではない */ }

    const cached = await idbGet('dict:' + stamp).catch(()=>null);
    if (cached && cached.length){
      DICT = cached; prog.style.width = '100%';
    } else {
      const resp = await fetch(DATA_CSV);
      if (!resp.ok) throw new Error(DATA_CSV + ' が取得できません (' + resp.status + ')');
      /* 数MBあるので進捗を出す。Content-Lengthが無い（gzip配信）場合は不定表示。 */
      const total = +resp.headers.get('content-length') || 0;
      const reader = resp.body && resp.body.getReader ? resp.body.getReader() : null;
      let text;
      if (reader){
        const chunks = []; let got = 0;
        for(;;){
          const {done, value} = await reader.read();
          if (done) break;
          chunks.push(value); got += value.length;
          prog.style.width = total ? Math.min(99, got/total*100) + '%' : '60%';
        }
        text = new TextDecoder('utf-8').decode(await new Blob(chunks).arrayBuffer());
      } else {
        text = await resp.text();
      }
      prog.style.width = '100%';
      DICT = buildDict(text);
      idbSet('dict:' + stamp, DICT).catch(()=>{}); // キャッシュ失敗は無視してよい
    }
    $('loading').hidden = true; $('app').hidden = false;
    loadSavedList(); render();
  }catch(e){
    $('loading').innerHTML = '<p class="err">読み込みに失敗しました：' + e.message +
      '</p><p class="hint">GitHub Pages の公開元と、ワークフローが data/ を配置しているかを確認してください。</p>';
  }
}

/* ------------------------------------------------------------------ *
 * 検索：スコア別バケツに集めて件数で打ち切る。18万件を毎回sortしない。
 * ------------------------------------------------------------------ */
function search(rawQ, cat, limit){
  const q = rawQ.trim().toLowerCase().replace(/_/g,' ');
  if (!q) return [];
  const cap = limit * 4;
  const qw = ' ' + q;
  // 完全一致 / 語頭一致 / 和名前方 / 部分一致 / 和名部分
  // 「語頭一致」は先頭だけでなく2語目以降の語頭も含める。段の中は投稿数順なので、
  // "miku" と打てば hatsune miku が mikuma (kancolle) より上に来る。
  const b = [[],[],[],[],[]];
  for (let i=0;i<DICT.length;i++){
    const e = DICT[i];
    if (cat !== '' && e.c !== +cat) continue;
    let k = -1;
    if (e.tl === q || e.jal === q) k = 0;
    else if (e.tl.startsWith(q) || e.tl.indexOf(qw) >= 0) k = 1;
    else if (e.jal && e.jal.startsWith(q)) k = 2;
    else if (e.tl.indexOf(q) >= 0) k = 3;
    else if (e.jal && e.jal.indexOf(q) >= 0) k = 4;
    if (k >= 0 && b[k].length < cap) b[k].push(e);
    if (b[0].length + b[1].length >= cap) break;
  }
  const out = [];
  for (const bucket of b){
    if (out.length >= limit) break;
    bucket.sort((x,y)=> y.cnt - x.cnt);
    for (let i=0;i<bucket.length && out.length<limit;i++) out.push(bucket[i]);
  }
  return out;
}

function rowHtml(e){
  return `<div class="row" data-t="${esc(e.t)}">
    <span class="dot" style="background:${CAT_COLOR[e.c]||'#5b7fa6'}" title="${CAT_NAME[e.c]||''}"></span>
    <span class="en">${esc(e.t)}</span>
    <span class="ja">${esc(e.ja||'')}</span>
    <span class="cnt">${e.cnt ? e.cnt.toLocaleString() : ''}</span>
  </div>`;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ------------------------------------------------------------------ *
 * 共起：保存済みレシピから「同じレシピに入っていた回数」を数える。
 * 外部APIを使わずに済み、使い込むほど自分の作風に寄っていく。
 * ------------------------------------------------------------------ */
function cooccurrence(){
  const cur = new Set(recipe.map(r=>r.t));
  if (!cur.size) return [];
  const score = new Map();
  for (const r of listSaved()){
    const tags = (r.tags||[]).map(t=>t.t);
    const hit = tags.filter(t=>cur.has(t)).length;
    if (!hit) continue;
    for (const t of tags){
      if (cur.has(t)) continue;
      score.set(t, (score.get(t)||0) + hit);
    }
  }
  const byTag = new Map(DICT.map(e=>[e.t, e]));
  return [...score.entries()].sort((a,b)=>b[1]-a[1]).slice(0,12)
    .map(([t])=> byTag.get(t) || {t, c:0, cnt:0, ja:''});
}

/* ---------------------------- レシピ操作 ---------------------------- */
function addTag(t){
  if (recipe.some(r=>r.t === t)) return;      // 重複は無視（出力が二重になるため）
  const e = DICT.find(x=>x.t === t) || {t, c:0, ja:''};
  recipe.push({ t:e.t, ja:e.ja, c:e.c, w:0 });
  render();
}
function fmtTag(r, mode){
  const w = r.w;
  if (mode === 'plain' || w === 0) return r.t;
  if (mode === 'sd'){
    const v = Math.pow(1.1, w);
    return '(' + r.t + ':' + v.toFixed(2).replace(/0+$/,'').replace(/\.$/,'') + ')';
  }
  if (mode === 'nai-num'){
    const v = Math.pow(1.05, w);
    return v.toFixed(2).replace(/0+$/,'').replace(/\.$/,'') + '::' + r.t + '::';
  }
  const n = Math.abs(w);
  return (w > 0 ? '{'.repeat(n) + r.t + '}'.repeat(n) : '['.repeat(n) + r.t + ']'.repeat(n));
}
function render(){
  const mode = $('fmt').value;
  $('chips').innerHTML = recipe.length ? recipe.map((r,i)=>`
    <span class="chip ${r.w>0?'pos':r.w<0?'neg':''}">
      <span class="dot" style="background:${CAT_COLOR[r.c]||'#5b7fa6'}"></span>
      <span title="${esc(r.ja||'')}">${esc(r.t)}</span>
      <button data-act="dn" data-i="${i}" title="弱める">−</button>
      <span class="w">${r.w>0?'+'+r.w:r.w}</span>
      <button data-act="up" data-i="${i}" title="強める">＋</button>
      <button data-act="rm" data-i="${i}" title="削除">✕</button>
    </span>`).join('')
    : '<span class="hint" style="margin:4px 8px;">左の一覧からタグをクリックして追加してください。</span>';
  $('out').value = recipe.map(r=>fmtTag(r, mode)).join(', ');

  const co = cooccurrence();
  $('cooc-wrap').hidden = co.length === 0;
  $('cooc').innerHTML = co.map(rowHtml).join('');
}

/* --------------------------- 保存まわり --------------------------- */
const SAVE_KEY = 'tagrecipe:saved';
function listSaved(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)) || []; }catch(e){ return []; } }
function writeSaved(v){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(v)); }
  catch(e){ alert('保存できませんでした（ブラウザの保存容量の上限かもしれません）。'); }
}
function loadSavedList(){
  const sel = $('saved');
  sel.innerHTML = '<option value="">保存済みレシピ…</option>' +
    listSaved().map((r,i)=>`<option value="${i}">${esc(r.name||'(無題)')}</option>`).join('');
}

/* ----------------------------- 配線 ----------------------------- */
let searchTimer = null;
function runSearch(){
  $('results').innerHTML = search($('q').value, $('cat').value, 40).map(rowHtml).join('')
    || '<p class="hint">該当するタグがありません。</p>';
}
$('q').addEventListener('input', ()=>{ clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 80); });
$('cat').addEventListener('change', runSearch);
document.addEventListener('click', e=>{
  const row = e.target.closest('.row');
  if (row){ addTag(row.dataset.t); return; }
  const btn = e.target.closest('.chip button');
  if (btn){
    const i = +btn.dataset.i;
    if (btn.dataset.act === 'rm') recipe.splice(i,1);
    else if (btn.dataset.act === 'up') recipe[i].w = Math.min(5, recipe[i].w + 1);
    else recipe[i].w = Math.max(-5, recipe[i].w - 1);
    render();
  }
});
$('fmt').addEventListener('change', render);
$('btn-copy').addEventListener('click', async ()=>{
  const ta = $('out');
  try{ await navigator.clipboard.writeText(ta.value); }
  catch(e){ ta.select(); document.execCommand('copy'); }
  const b = $('btn-copy'); b.textContent = 'コピーしました'; setTimeout(()=>b.textContent='コピー', 1200);
});
$('btn-clear').addEventListener('click', ()=>{ recipe = []; render(); });
$('btn-save').addEventListener('click', ()=>{
  const name = $('recipe-name').value.trim() || '無題のレシピ';
  const all = listSaved();
  const idx = all.findIndex(r=>r.name === name);
  const rec = { name, tags: recipe.map(r=>({t:r.t, w:r.w})), at: new Date().toISOString() };
  if (idx >= 0) all[idx] = rec; else all.push(rec);
  writeSaved(all); loadSavedList(); render();
});
$('saved').addEventListener('change', e=>{
  const r = listSaved()[+e.target.value];
  if (!r) return;
  const byTag = new Map(DICT.map(x=>[x.t, x]));
  recipe = (r.tags||[]).map(t=>{ const e2 = byTag.get(t.t) || {t:t.t, c:0, ja:''}; return {t:t.t, ja:e2.ja, c:e2.c, w:t.w||0}; });
  $('recipe-name').value = r.name || '';
  render();
});
$('btn-del').addEventListener('click', ()=>{
  const i = +$('saved').value;
  if ($('saved').value === '' || !confirm('このレシピを削除しますか？')) return;
  const all = listSaved(); all.splice(i,1); writeSaved(all); loadSavedList();
});
$('btn-export').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify({recipes:listSaved()}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tag-recipes-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
});
$('btn-import').addEventListener('click', ()=> $('file-import').click());
$('file-import').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const d = JSON.parse(fr.result);
      if (!Array.isArray(d.recipes)) throw new Error('recipes配列がありません');
      writeSaved(listSaved().concat(d.recipes)); loadSavedList();
    }catch(err){ alert('読み込みに失敗しました：' + err.message); }
    e.target.value = '';
  };
  fr.readAsText(f, 'utf-8');
});

load();
</script>
