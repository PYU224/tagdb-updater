      #     pip install huggingface_hub
      #     python - <<'PY'
      #     import os
      #     from huggingface_hub import HfApi
      #     api = HfApi(token=os.environ["HF_TOKEN"])
      #     api.upload_folder(
      #         folder_path="dist",
      #         repo_id="your-username/danbooru-tags-ja",  # 事前にHF上でdataset repoを作成しておく
      #         repo_type="dataset",
      #     )
      #     PY
